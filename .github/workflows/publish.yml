name: Publish

# Publishing a GitHub release uploads that version to PyPI. PyPI trusts this
# workflow (trusted publishing), so the repository holds no token.
on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check that the tag matches the package version
        run: |
          version=$(grep -Po '__version__ = "\K[^"]+' src/astraeos_astro/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: pipx run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/astraeos-astro/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
